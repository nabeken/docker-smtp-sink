services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:caf667c8ab1a1dd7d38cf0de1136ef18357a9e19311e20c70c06a51464eb7876
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
