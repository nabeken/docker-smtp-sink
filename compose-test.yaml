services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:d29ae97928b60e61dccdfda71a1badb05db430fce17a294ad63bc809aac3d4b7
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
