services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:9d5c493dffa74687b5bf10eff8d1c0c19d9b90e763efcebd889554946d667247
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
