services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:4bc57d41d84e5dec42df15f02c7ca50c8c348b093636a9cb521d11839ddbf438
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
