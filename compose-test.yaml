services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:3bde6bbe175c9beaeed21b4031d30971da96e8f5bf203e4d4883c2f6b4bd177f
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
