services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:63ca8d7b278a81859b2c288282390ce0eda3815db615b7aa5d803aa19e9518d1
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
