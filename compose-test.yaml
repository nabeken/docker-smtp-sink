services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:73027626794a0389b7f11d5382f32ba3a9146a0bbef2967e943b3187a4ce7671
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
