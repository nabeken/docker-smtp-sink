services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:862c67bfd92b6a406a6cb3bea34aaf7ada5c7918808d97ab169408a24451523f
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
