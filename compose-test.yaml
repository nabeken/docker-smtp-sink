services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:6f63ccf07026cfe52cf853267871f3436f695587ee6218765271393eee324e73
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
