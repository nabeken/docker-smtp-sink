services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:092c0c117059cd1e248caa74381f6936d5ff21ed573b5559239d54d44c355074
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
