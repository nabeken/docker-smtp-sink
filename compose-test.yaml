services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:e2783c97c319284d07792395b407b96b3c28d88939ba7ca2d52f9729379bfde9
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
