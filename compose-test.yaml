services:
  rsync:
    image: ghcr.io/nabeken/docker-volume-container-rsync:latest@sha256:63bb209175ab08e8a36eeca5cde9b94ad9b40a68a9bb8e2297e9f8ecaa80f9b7
    volumes:
      - vol:/docker
    ports:
      - "10873:873"

  sink:
    image: ghcr.io/nabeken/docker-smtp-sink:action-local-test
    volumes:
      - vol:/sink
    ports:
      - "10025:10025"
    command: ["-v", "-h", "mx.example.com", "-m", "100", "-d", "/sink/", ":10025", "100"]

volumes:
  vol:
